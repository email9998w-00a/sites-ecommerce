  <style>
    :root {
      --ink: #182f40;
      --ink-soft: #62747f;
      --brand: #087b9b;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: 'DM Sans', Arial, sans-serif; }

    .page { width: min(100%, 520px); min-height: 100vh; margin: auto; padding: 0 16px 22px; }

    header {

      align-items: center;
      justify-content: space-between;
      min-height: 66px;
      border-bottom: 1px solid var(--line);

    .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: .73rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

    h1 { color: var(--ink); font-family: 'Manrope', sans-serif; font-size: clamp(2.15rem, 10vw, 3.2rem); font-weight: 800; line-height: 1.04; letter-spacing: -.065em; }
    h1 span { display: block; color: var(--brand); }

    .offer-card { position: relative; overflow: hidden; margin: 26px auto 0; padding: 25px 20px 21px; border: 1px solid var(--line); border-radius: 18px; background: var(--white); box-shadow: 0 14px 32px rgba(24,47,64,.08); }
    .offer-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; background: linear-gradient(90deg, var(--brand), #5bc4cd); }
    .offer-label { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; background: var(--accent-pale); color: var(--accent); font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .offer-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .discount { margin: 19px 0 8px; color: var(--accent); font-family: 'Manrope', sans-serif; font-size: clamp(4.15rem, 20vw, 5.9rem); font-weight: 800; line-height: .82; letter-spacing: -.1em; }
    .description { max-width: 300px; margin: 0 auto; color: var(--ink-soft); font-size: .82rem; line-height: 1.45; }

    .cta { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 62px; margin-top: 20px; padding: 16px 18px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: var(--white); text-decoration: none; font-size: .98rem; font-weight: 700; letter-spacing: .015em; box-shadow: 0 10px 20px rgba(8,123,155,.22); transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
    .cta:hover { filter: brightness(1.06); box-shadow: 0 12px 24px rgba(8,123,155,.28); transform: translateY(-2px); }
    .cta:active { transform: scale(.985); }
    .arrow { margin-left: 10px; font-size: 1.3rem; line-height: 0; }
    .note { display: inline-flex; align-items: center; gap: 5px; margin-top: 13px; color: var(--ink-soft); font-size: .62rem; }
    .note::before { content: '✓'; color: var(--success); font-weight: 800; }

    footer { padding: 17px 0 20px; border-top: 1px solid var(--line); color: var(--ink-soft); text-align: center; font-size: .58rem; line-height: 1.45; }
    footer strong { color: var(--ink); font-weight: 600; }

    @media (max-width: 380px) {
