  <style>
    :root {
      --ink: #10232b;
      --ink-soft: #4f6b74;
      --paper: #f3f7f8;
      --surface: #ffffff;
      --line: #dde6e8;
      --brand: #0b6f86;
      --brand-deep: #084f60;
      --accent: #a8432f;
      --success: #1f7a52;
      --radius-lg: 18px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }

    .page {
      display: flex;
      flex-direction: column;
      width: min(100%, 440px);
      min-height: 100vh;
      margin: auto;
      padding: 0 22px 16px;
    }

    /* Header — só identificação, nada de leitura extra */
    header {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 56px;
    }
    .brand-mark {
      display: grid; place-items: center; width: 30px; height: 30px; padding: 4px;
      border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name { font-family: 'Manrope', sans-serif; font-size: .84rem; font-weight: 800; letter-spacing: -.01em; }

    /* Hero — tudo o que o usuário precisa ver, sem rolar */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 9vw, 2.55rem);
      line-height: 1.1;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    h1 .pct { color: var(--accent); }

    .subhead {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: .95rem;
      line-height: 1.5;
    }

    .cta {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 60px; margin-top: 22px;
      padding: 14px 18px; border-radius: var(--radius-sm);
      background: var(--brand); color: #fff; text-decoration: none;
      font-size: 1.02rem; font-weight: 700; letter-spacing: -.005em;
      box-shadow: 0 14px 28px -8px rgba(11,111,134,.42);
      transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
    }
    .cta:hover { background: var(--brand-deep); box-shadow: 0 16px 32px -8px rgba(11,111,134,.48); }
    .cta:active { transform: scale(.985); }
    .cta:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: 3px; }

    .cta-note {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 13px; color: var(--ink-soft); font-size: .72rem;
    }
    .cta-note svg { width: 13px; height: 13px; color: var(--success); flex: none; }

    footer {
      padding-top: 14px; border-top: 1px solid var(--line);
      color: var(--ink-soft); font-size: .6rem; line-height: 1.5;
    }
    footer strong { color: var(--ink); font-weight: 600; }
    footer .legal-note { margin-top: 4px; opacity: .8; }

    @media (max-height: 620px) {
      .cta { margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
